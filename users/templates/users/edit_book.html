<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa thông tin sách</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="form-container">
        <h2>Sửa Thông Tin Sách</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Tên sách:</label>
                <!-- Điền sẵn tên sách cũ vào ô input -->
                <input type="text" id="title" name="title" value="{{ book.title }}" placeholder="Nhập tên sách" required>
            </div>

            <div class="form-group">
                <label for="author">Tác giả:</label>
                <!-- Điền sẵn tên tác giả cũ vào ô input -->
                <input type="text" id="author" name="author" value="{{ book.author }}" placeholder="Nhập tên tác giả" required>
            </div>

            <button type="submit" class="btn">Lưu thay đổi</button>
            <p><a href="{% url 'custom_admin' %}">Hủy bỏ & Quay lại Bảng điều khiển</a></p>
        </form>
    </div>
</body>
</html>
