services:
  web:
    container_name: E-Library-web
    image: node:25
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - /app/web/node_modules # Tránh xung đột thư viện giữa Mac/Win/Linux
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Để máy Windows sửa code tự reload
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- --host"
